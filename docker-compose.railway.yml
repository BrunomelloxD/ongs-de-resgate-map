# Optional override: the local api stores photos in a hosted bucket (Railway)
# instead of MinIO. Used only by `make dev-railway`; `make dev`, `make e2e` and
# `make gate` never load this file, so tests always run against MinIO.
#
#   docker compose -f docker-compose.yml -f docker-compose.railway.yml up --build
#
# S3_* come from apps/api/.env.railway (gitignored). The base file sets S3_* in
# `environment`, which wins over `env_file`, so the whole block is replaced here
# (`!override`) and only the non-S3 overrides are declared again.

services:
  api:
    env_file:
      - apps/api/.env
      - apps/api/.env.railway
    environment: !override
      PORT: ${API_PORT:-3333}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-app}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      SMTP_URL: smtp://mailpit:1025
